name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'Taller de capacitación Manizales - CEPE/frontend/**'
      - 'Pretest - Postest/frontend/**'
      - 'Comité académico 25-09-2026/frontend/**'
      - 'Acompañamiento entre pares/Sesión 1/frontend/**'
      - 'Percepción pertinencia del programa/frontend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  PROJECT_DIR: 'Taller de capacitación Manizales - CEPE/frontend'
  SITE_SLUG: metodologias-activas-manizales
  PROJECT_DIR_2: 'Pretest - Postest/frontend'
  SITE_SLUG_2: pretest-postest-metodologias-activas
  PROJECT_DIR_3: 'Comité académico 25-09-2026/frontend'
  SITE_SLUG_3: comite-academico-matrices
  PROJECT_DIR_4: 'Acompañamiento entre pares/Sesión 1/frontend'
  SITE_SLUG_4: acompanamiento-pares-sesion-1
  PROJECT_DIR_5: 'Percepción pertinencia del programa/frontend'
  SITE_SLUG_5: percepcion-pertinencia-programa

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            ${{ env.PROJECT_DIR }}/package-lock.json
            ${{ env.PROJECT_DIR_2 }}/package-lock.json
            ${{ env.PROJECT_DIR_3 }}/package-lock.json
            ${{ env.PROJECT_DIR_4 }}/package-lock.json
            ${{ env.PROJECT_DIR_5 }}/package-lock.json

      - name: Instalar dependencias — Metodologías Activas (CEPE)
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm ci

      - name: Build — Metodologías Activas (CEPE)
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      - name: Instalar dependencias — Pretest / Postest
        working-directory: ${{ env.PROJECT_DIR_2 }}
        run: npm ci

      - name: Build — Pretest / Postest
        working-directory: ${{ env.PROJECT_DIR_2 }}
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL_PRETEST_POSTEST }}
        run: npm run build

      - name: Instalar dependencias — Comité Académico (matrices)
        working-directory: ${{ env.PROJECT_DIR_3 }}
        run: npm ci

      - name: Build — Comité Académico (matrices)
        working-directory: ${{ env.PROJECT_DIR_3 }}
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL_COMITE_ACADEMICO }}
        run: npm run build

      - name: Instalar dependencias — Acompañamiento entre Pares (Sesión 1)
        working-directory: ${{ env.PROJECT_DIR_4 }}
        run: npm ci

      - name: Build — Acompañamiento entre Pares (Sesión 1)
        working-directory: ${{ env.PROJECT_DIR_4 }}
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL_ACOMPANAMIENTO_PARES }}
        run: npm run build

      - name: Instalar dependencias — Percepción pertinencia del programa
        working-directory: ${{ env.PROJECT_DIR_5 }}
        run: npm ci

      - name: Build — Percepción pertinencia del programa
        working-directory: ${{ env.PROJECT_DIR_5 }}
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL_PERCEPCION_PERTINENCIA }}
        run: npm run build

      - name: Ensamblar sitio
        run: |
          mkdir -p "site/${SITE_SLUG}"
          cp -r "${PROJECT_DIR}/dist/." "site/${SITE_SLUG}/"
          mkdir -p "site/${SITE_SLUG_2}"
          cp -r "${PROJECT_DIR_2}/dist/." "site/${SITE_SLUG_2}/"
          mkdir -p "site/${SITE_SLUG_3}"
          cp -r "${PROJECT_DIR_3}/dist/." "site/${SITE_SLUG_3}/"
          mkdir -p "site/${SITE_SLUG_4}"
          cp -r "${PROJECT_DIR_4}/dist/." "site/${SITE_SLUG_4}/"
          mkdir -p "site/${SITE_SLUG_5}"
          cp -r "${PROJECT_DIR_5}/dist/." "site/${SITE_SLUG_5}/"

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
